<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content=""width=devicewidth, initial-scale="1.0">
    <title>CS Marketplace</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <header class="header">
        <div class="header-content">
            <h1 class="logo">CS Marketplace</h1>
            <nav class="nav-buttons">
		        <button class="nav-btn" id="viewBtn">View Events</button>
		        <button class="nav-btn" id="scheduleBtn">Schedule Events</button>
                <button class="nav-btn" id="loginBtn">Login/Sign Up</button>
                <button class="nav-btn" id="contactBtn">Contact Us</button>
                <button class="nav-btn" id="joinBtn">Join Group</button>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="calendar-container">
            <div class="calendar-header">
                <button class="calendar-nav-btn" id="previousMonth">Previous</button>
                <h2 class="calendar-title" id="monthYear"></h2>
                <button class="calendar-nav-btn" id="nextMonth">Next</button>
            </div>

            <div class="calendar-grid">
                <div class="calendar-weekdays">
                    <div class="weekday">Sun</div>
                    <div class="weekday">Mon</div>
                    <div class="weekday">Tues</div>
                    <div class="weekday">Wed</div>
                    <div class="weekday">Thurs</div>
                    <div class="weekday">Fri</div>
                    <div class="weekday">Sat</div>
                </div>
                <div class="calendar-days" id="calendarDays"></div>
            </div>
        </div>
    </main>

    <!-- event details modal -->
    <div id="eventModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2 class="modal-title">Event Details</h2>
            <div class="modal-body">
                <div class="modal-field">
                    <strong>Event Name:</strong>
                    <span id="modalEventName"></span>
                </div>
                <div class="modal-field">
                    <strong>Date:</strong>
                    <span id="modalEventDate"></span>
                </div>
                <div class="modal-field">
                    <strong>Time:</strong>
                    <span id="modalEventTime"></span>
                </div>
                <div class="modal-field">
                    <strong>Location:</strong>
                    <span id="modalEventLocation"></span>
                </div>
                <div class="modal-field">
                    <strong>Capacity:</strong>
                    <span id="modalEventCapacity"></span>
                </div>
            </div>
        </div>
    </div>

    <script src="./js/script.js"></script>

</body>
</html>
