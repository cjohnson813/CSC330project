<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Event</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <header class="header">
    <div class="header-content">
      <div class="logo">CSMarketplace</div>
      <div class="nav-buttons">
        <button class="nav-btn" onclick="window.location.href='index.html'">Home</button>
        <button class="nav-btn" onclick="window.location.href='viewEvents.html'">View Events</button>
        <button class="nav-btn" onclick="window.location.href='scheduleEvent.html'">Schedule Event</button>
      </div>
    </div>
  </header>

  <div class="login-page">
    <div class="login-container">
      <h1>Edit Event</h1>

      <form id="editEventForm" class="login-form">
        <label for="eventName">Event Name</label>
        <input type="text" id="eventName" placeholder="Event Name" required>

        <label for="eventDate">Event Date</label>
        <input type="date" id="eventDate" required>

        <label for="eventLocation">Location</label>
        <input type="text" id="eventLocation" placeholder="Location" required>

        <label for="eventTime">Start Time</label>
        <input type="time" id="eventTime" placeholder="Start Time" required>

        <label for="eventCapacity">Event Capacity</label>
        <input type="number" id="eventCapacity" placeholder="Event Capacity" required>

        <!-- Status message for errors/success -->
        <p id="statusMessage" style="margin-top: 10px;"></p>

        <button type="submit" class="nav-btn" style="width: 100%; margin-top: 10px;">
          Save Changes
        </button>

        <button type="button" id="cancelBtn" class="nav-btn" style="width: 100%; margin-top: 10px;">
          Cancel
        </button>
      </form>

      <p style="margin-top: 10px;">
        <a href="admin.html">← Back to Events</a>
      </p>
    </div>
  </div>

  <script src="js/editEvent.js"></script>
</body>

</html>
