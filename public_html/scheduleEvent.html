<!DOCTYPE html>
<html lang="en">


<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule Event</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <h1>Schedule an Event</h1>

  <form id="eventForm">
    <p><input type="text" id="eventName" placeholder="Event Name" required></p>
    <p><input type="date" id="eventDate" required></p>
    <p><input type="text" id="eventLocation" placeholder="Location" required></p>
    <p><input type="time" id="eventTime" required></p>
    <p><button type="submit">Submit</button></p>
  </form>

  <p><a href="index.html">Back to Home</a></p>

  <script src="js/scheduleEvent.js"></script>
</body>


</html>
