<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Marketplace - Admin</title>
    <link rel="stylesheet" href="styles.css">
    <!--src to anime.js library for admin.js animations-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
</head>

<body>
    <header class="header">
        <div class="header-content">
            <h1 class="logo">CS Marketplace</h1>
            <nav class="nav-buttons">
                <button class="nav-btn" id="viewProfileBtn">View Profile</button>
                <button class="nav-btn" id="contactBtn"></button>
                <button class="nav-btn" id="joinBtn">Join Group</button>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <!-- Button to load all pending event requests-->
         <section class = "admin-actions">
            <button class="primary-btn" id="viewRequestsBtn">
                Vew Event requests
            </button>
        </section>

        <!--Table containing event requests-->
        <section class="requests-section">
            <h2>Pending Event Requests</h2>
            <table id="requestsTable">
                <thead>
                    <tr>
                        <th>Event ID</th>
                        <th>Event Name</th>
                        <th>Event Date</th>
                        <th>Event Time</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="requestsTableBody">
                    <!--Fileed by admin.js if there are any pendind requests-->
                </tbody>
            </table>
        </section>

    </main>
    <script src="./js/admin.js"></script>
</body>
</html>
